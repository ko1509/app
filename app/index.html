<title>ミアゲタビ 管理アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* レイアウト：KOAlil.com 管理アプリと同じ Liquid Glass。色の流れる背景の上に、ガラスのナビ・カード・下部タブバーが浮かぶ。
   この題材だけのもの：イベント日からの「T−n」カウントダウンと、打ち上げ／天体／宇宙スポット／機材の4色 */
:root{
  --ambient-1:#7cc4ff; --ambient-2:#ffb38a; --ambient-3:#b9a6ff; --ambient-4:#8ee6c7; --ambient-base:#eef1f6;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-solid:rgba(255,255,255,.94);
  --glass-edge:rgba(255,255,255,.75); --glass-rim:rgba(0,0,0,.06); --glass-sheen:rgba(255,255,255,.55);
  --glass-shadow:0 10px 30px rgba(15,30,60,.10),0 2px 6px rgba(15,30,60,.06); --glass-blur:blur(22px) saturate(185%);
  --lens:rgba(255,255,255,.92);
  --label:#1d1d1f; --label-2:#6e6e73; --label-3:#86868b; --separator:rgba(60,60,67,.14);
  --fill:rgba(118,118,128,.12); --fill-strong:rgba(118,118,128,.2);
  /* アクセントはサイトの SIGNAL ORANGE（ロゴの星と発射台の色） */
  --brand:#E8481C; --accent:#E8481C; --on-accent:#ffffff; --link:#c2380f;
  --good:#1a7f37; --warn:#946200; --bad:#d70015;
  --good-bg:rgba(52,199,89,.16); --warn-bg:rgba(214,170,40,.2); --bad-bg:rgba(255,59,48,.14);
  --en:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --launch:#e8590c; --sky:#5856d6; --spot:#0f9d8a; --gear:#8e6b3e;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  --tabbar-h:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ambient-1:#1d4f91; --ambient-2:#7a3a1c; --ambient-3:#43307e; --ambient-4:#16564a; --ambient-base:#05070b;
  --glass:rgba(44,46,54,.5); --glass-strong:rgba(48,50,58,.72); --glass-solid:rgba(28,28,32,.96);
  --glass-edge:rgba(255,255,255,.16); --glass-rim:rgba(255,255,255,.05); --glass-sheen:rgba(255,255,255,.12);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3); --lens:rgba(255,255,255,.2);
  --label:#f5f5f7; --label-2:#a1a1a6; --label-3:#8e8e93; --separator:rgba(84,84,88,.5);
  --fill:rgba(118,118,128,.24); --fill-strong:rgba(118,118,128,.36);
  --brand:#ff6a3d; --accent:#ff6a3d; --on-accent:#ffffff; --link:#ff8a63;
  --good:#30d158; --warn:#e3b341; --bad:#ff6961;
  --good-bg:rgba(48,209,88,.18); --warn-bg:rgba(227,179,65,.2); --bad-bg:rgba(255,69,58,.2);
  --launch:#ff8a3d; --sky:#8e8cff; --spot:#3ed6bf; --gear:#d1a56b; color-scheme:dark}}
:root[data-theme="dark"]{
  --ambient-1:#1d4f91; --ambient-2:#7a3a1c; --ambient-3:#43307e; --ambient-4:#16564a; --ambient-base:#05070b;
  --glass:rgba(44,46,54,.5); --glass-strong:rgba(48,50,58,.72); --glass-solid:rgba(28,28,32,.96);
  --glass-edge:rgba(255,255,255,.16); --glass-rim:rgba(255,255,255,.05); --glass-sheen:rgba(255,255,255,.12);
  --glass-shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3); --lens:rgba(255,255,255,.2);
  --label:#f5f5f7; --label-2:#a1a1a6; --label-3:#8e8e93; --separator:rgba(84,84,88,.5);
  --fill:rgba(118,118,128,.24); --fill-strong:rgba(118,118,128,.36);
  --brand:#ff6a3d; --accent:#ff6a3d; --on-accent:#ffffff; --link:#ff8a63;
  --good:#30d158; --warn:#e3b341; --bad:#ff6961;
  --good-bg:rgba(48,209,88,.18); --warn-bg:rgba(227,179,65,.2); --bad-bg:rgba(255,69,58,.2);
  --launch:#ff8a3d; --sky:#8e8cff; --spot:#3ed6bf; --gear:#d1a56b; color-scheme:dark}
@media (prefers-reduced-transparency: reduce){:root{--glass:var(--glass-solid);--glass-strong:var(--glass-solid);--glass-blur:none}}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--ambient-base);color:var(--label);font-family:var(--font);font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom,0px))}
a{color:var(--link);text-decoration:none}
/* 英字のラベル（サイトと同じく IBM Plex Mono の大文字・字間を広く。頭にオレンジの■） */
.en,.en-l{font-family:var(--en);text-transform:uppercase;letter-spacing:.16em;font-weight:600;font-size:11px;line-height:1;color:var(--label-2);white-space:nowrap}
.en::before,.en-l::before{content:"";display:inline-block;width:7px;height:7px;background:var(--brand);margin-right:7px;vertical-align:1px}
.en-l{display:block;margin:0 0 6px} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 背景 */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--ambient-base);pointer-events:none}
.ambient i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.55}
.ambient i:nth-child(1){background:var(--ambient-1);top:-22vmax;left:-14vmax;animation:drift1 38s ease-in-out infinite alternate}
.ambient i:nth-child(2){background:var(--ambient-2);top:18vh;right:-24vmax;animation:drift2 44s ease-in-out infinite alternate}
.ambient i:nth-child(3){background:var(--ambient-3);bottom:-30vmax;left:10vw;animation:drift1 52s ease-in-out infinite alternate-reverse}
.ambient i:nth-child(4){background:var(--ambient-4);top:45vh;left:-20vmax;width:40vmax;height:40vmax;animation:drift2 47s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-7vmax,-5vmax) scale(.94)}}

/* ガラス */
.glass,.navbar-inner,.d-card,.d-stat,.d-group,.d-col,.tabbar,.toast,.tminus{
  background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-sheen),inset 0 -1px 0 var(--glass-rim)}

/* ナビ（浮かぶカプセル） */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-top:10px}
.navbar-inner{max-width:1180px;margin:0 auto;height:52px;border-radius:999px;padding:0 8px 0 14px;display:flex;align-items:center;gap:10px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
/* ロゴ：サイトのヘッダーと同じ画像（miagetabi.space の miagetabi-logo-header.png）。暗い画面では白抜き（オレンジは星と発射台のまま） */
.brand .logo{height:18px;width:auto;display:block}
.brand .logo-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo-l{display:none}:root:not([data-theme="light"]) .brand .logo-d{display:block}}
:root[data-theme="dark"] .brand .logo-l{display:none} :root[data-theme="dark"] .brand .logo-d{display:block}
#themeBtn,#inboxBtn{width:32px;padding:0;justify-content:center} #themeBtn svg,#inboxBtn svg{width:18px;height:18px}
.hbtn.back{padding:0 6px;background:transparent;color:var(--accent)} .hbtn.back svg{width:20px;height:20px}
.nav-spacer{flex:1}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--label-2);padding:0 10px;height:30px;border-radius:999px;background:var(--fill);white-space:nowrap}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--label-3)}
.conn.on i{background:var(--good)} .conn.off i{background:var(--warn)}
@media (max-width:420px){.conn .txt{display:none}.conn{padding:0 8px}}
.hbtn{position:relative;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;border:0;background:var(--fill);color:var(--label);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.hbtn[aria-current="page"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.hdot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:520px){.island{max-width:40vw;padding-right:8px}.island .isl-txt b{display:none}.island .isl-n{display:none}.navbar-inner{gap:6px;padding:0 6px 0 10px}.conn.on{display:none}}
@media (max-width:400px){.island .isl-msg{display:none}}
@media (max-width:400px){.brand .logo{height:14px}}

/* ページ */
.page{max-width:1180px;margin:0 auto;display:grid;gap:22px}
.d-head{padding-block:22px 0;display:grid;gap:2px}
.d-head p{margin:0 0 6px;color:var(--label-2);font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.hd-date{font-family:var(--en);font-size:12px;letter-spacing:.06em;color:var(--label-3)}
.d-head h1{margin:0;font-size:clamp(32px,5.5vw,48px);line-height:1.08;letter-spacing:-.03em;font-weight:700;text-wrap:balance;word-break:auto-phrase}
.d-sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.d-sec h2{margin:0;font-size:22px;letter-spacing:-.02em}
.d-sec p{margin:0;color:var(--label-2);font-size:14px}
.d-card{border-radius:24px;padding:18px;min-width:0}
.d-grid2{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:900px){.d-grid2{grid-template-columns:3fr 2fr}}
.d-grid2>*{min-width:0}
.stack{display:grid;gap:22px;align-content:start;min-width:0}

/* T−n カウントダウン */
.strip{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tminus{border-radius:22px;padding:14px 16px;display:grid;gap:4px;min-width:0;cursor:pointer;text-align:left;color:inherit}
.tminus:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent),var(--glass-shadow)}
.tminus .t{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.tminus .n{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tminus .s{font-size:12px;color:var(--label-3)}
.tminus[data-p="launch"] .t{color:var(--launch)} .tminus[data-p="sky"] .t{color:var(--sky)} .tminus[data-p="spot"] .t{color:var(--spot)} .tminus[data-p="gear"] .t{color:var(--gear)}

/* 数字のタイル */
.d-stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.d-stat{border-radius:22px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.d-stat .k{font-size:13px;color:var(--label-2);font-weight:500}
.d-stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.d-stat .v small{font-size:13px;font-weight:600;color:var(--label-3);margin-left:2px}
.d-stat .s{font-size:12px;color:var(--label-3)}
.d-bar{height:6px;border-radius:3px;background:var(--fill-strong);overflow:hidden;margin-top:6px}
.d-bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.d-stat.good .d-bar i{background:var(--good)} .d-stat.low .d-bar i{background:var(--warn)}

/* 設定アプリ風のリスト */
.d-group{border-radius:22px;overflow:hidden}
.d-group-title{font-size:13px;color:var(--label-2);font-weight:600;margin:0 6px 8px;display:flex;justify-content:space-between}
.d-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;position:relative;min-width:0;color:inherit;width:100%;border:0;background:transparent;text-align:left;font:inherit}
.d-row+.d-row::before{content:"";position:absolute;top:0;right:0;left:64px;border-top:.5px solid var(--separator)}
button.d-row{cursor:pointer} button.d-row:hover{background:var(--fill)}
.d-main{min-width:0}
.d-t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.d-sub{font-size:13px;color:var(--label-2);overflow-wrap:anywhere}
.d-when{font-size:12px;color:var(--label-3);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.d-row.late .d-when{color:var(--bad);font-weight:700}
.d-row.done .d-t{text-decoration:line-through;color:var(--label-3)}
.d-empty{padding:22px 16px;text-align:center;color:var(--label-2);font-size:14px}

/* 絵文字の代わりのピクトタイル */
.d-picto{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px rgba(0,0,0,.15)}
.d-picto::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.45),transparent 50%)}
.d-picto svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.pc-launch{background:var(--launch)} .pc-sky{background:var(--sky)} .pc-spot{background:var(--spot)} .pc-gear{background:var(--gear)} .pc-other{background:var(--label-3)}

/* チェック（丸） */
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--label-3);display:grid;place-items:center;cursor:pointer;background:transparent;color:#fff;padding:0}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.chk svg{width:14px;height:14px;stroke-width:3;opacity:0} .chk[aria-pressed="true"] svg{opacity:1}
.chk:disabled{cursor:not-allowed;opacity:.5}

/* ピル */
.d-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.d-pill.good{background:var(--good-bg);color:var(--good)} .d-pill.warn{background:var(--warn-bg);color:var(--warn)}
.d-pill.bad{background:var(--bad-bg);color:var(--bad)} .d-pill.mute{background:var(--fill);color:var(--label-2)}
.d-pill.info{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.d-pill.launch{background:color-mix(in srgb,var(--launch) 16%,transparent);color:var(--launch)}
.d-pill.sky{background:color-mix(in srgb,var(--sky) 16%,transparent);color:var(--sky)}
.d-pill.spot{background:color-mix(in srgb,var(--spot) 16%,transparent);color:var(--spot)}
.d-pill.gear{background:color-mix(in srgb,var(--gear) 18%,transparent);color:var(--gear)}
.pills{display:flex;gap:4px;flex-wrap:wrap;align-items:center}

/* ボタン・セグメント */
.d-btn{border:0;border-radius:999px;padding:0 16px;height:36px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.d-btn.secondary{background:var(--glass-strong);color:var(--accent);box-shadow:inset 0 1px 0 var(--glass-sheen),0 0 0 1px var(--glass-edge)}
.d-btn.danger{background:var(--bad)}
.d-btn.small{height:30px;font-size:13px;padding:0 12px}
.d-btn:active{transform:scale(.97)} .d-btn:disabled{opacity:.45;cursor:not-allowed}
.d-seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--fill);flex-wrap:wrap;max-width:100%}
.d-seg button{border:0;background:transparent;padding:0 14px;height:30px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--label);white-space:nowrap}
.d-seg button[aria-pressed="true"]{background:var(--lens);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* カンバン（記事） */
.d-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.d-board.n3{grid-template-columns:repeat(3,minmax(0,1fr))} .d-board.n1{grid-template-columns:minmax(0,1fr)} .d-board.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:860px){.d-board,.d-board.n3,.d-board.n5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.d-board.n3{grid-template-columns:minmax(0,1fr)}}
/* カテゴリの差し色（打ち上げ・天体・宇宙スポット・機材） */
.cat-launch{--cat:var(--launch)} .cat-sky{--cat:var(--sky)} .cat-spot{--cat:var(--spot)} .cat-gear{--cat:var(--gear)} .cat-other{--cat:var(--label-3)}
.d-kcard[class*="cat-"]{border-left:5px solid var(--cat);padding-left:10px}
.cat-col{border-top:3px solid var(--cat)}
.d-board.cats{grid-template-columns:repeat(var(--n,4),minmax(0,1fr))}
.plan-wrap{min-width:0} .d-board.cats.scroll{contain:inline-size}
.plan-more{display:block;width:100%;margin-top:4px;padding:8px;font-size:14px;text-align:center}
@media (max-width:860px){.d-board.cats.scroll{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(240px,78%);overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:2px 16px 8px;scroll-padding:0 16px;scrollbar-width:none} .d-board.cats.scroll::-webkit-scrollbar{display:none} .d-board.cats.scroll>.d-col{scroll-snap-align:start}}
.cat-name{display:inline-flex;align-items:center;gap:6px;color:var(--cat)} .cat-name i,.cat-legend i{width:9px;height:9px;border-radius:50%;background:var(--cat);display:inline-block}
.cat-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--label-2)} .cat-legend span{display:inline-flex;align-items:center;gap:5px}
.d-when .late{color:var(--bad);font-weight:700}
.d-col{border-radius:22px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.d-col h3{margin:2px 6px 4px;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.d-col h3 span{color:var(--label-3);font-weight:500}
.d-kcard{background:var(--glass-strong);border-radius:16px;padding:10px 12px;display:grid;gap:6px;min-width:0;border:1px solid var(--glass-edge);text-align:left;cursor:pointer;width:100%;color:inherit;font:inherit;
  box-shadow:inset 0 1px 0 var(--glass-sheen),0 2px 8px rgba(0,0,0,.06)}
.d-kcard:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.d-kcard .t{font-weight:600;font-size:14px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.kc{display:inline-flex;align-items:center;gap:3px;max-width:100%;padding:1px 6px;border-radius:7px;background:var(--fill);color:var(--label-2);font-size:11.5px;font-weight:600;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kc-bad{background:var(--bad-bg);color:var(--bad)} .kc-warn{background:var(--warn-bg);color:var(--warn)}
.kc-launch{color:var(--launch)} .kc-sky{color:var(--sky)} .kc-spot{color:var(--spot)} .kc-gear{color:var(--gear)}

/* 表 */
.d-table{overflow-x:auto}
.d-table table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.d-table th,.d-table td{padding:9px 12px;text-align:left;border-bottom:.5px solid var(--separator);vertical-align:top}
.d-table th{font-size:12px;color:var(--label-2);font-weight:600;white-space:nowrap}

const pubDate=a=>{const ev=parse(a.eventDate);return parse(a.publishBy)||(ev?addDays(ev,-(PUBLISH_LEAD[a.pillar]??14)):null)};

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200)}

/* ---------- 更新タスク ---------- */
function buildTasks(){
  const out=[];
  for(const a of S.articles){
    const ev=parse(a.eventDate),pub=pubDate(a),done=S.checks[a._id]||{};
    if(pub&&a.status!=="公開済み"&&a.status!=="要更新") out.push({a,key:"pub",date:pub,text:`公開する（いま：${ast(a)}）`,done:false,kind:"pub"});
    if(ev) for(const r of RULES) out.push({a,key:String(r.o),date:addDays(ev,r.o),text:r.t,done:!!done[String(r.o)],kind:"upd"});
  }
  return out.sort((x,y)=>x.date-y.date);
}

/* ---------- タブバー ---------- */
function buildTabbar(){
  const tb=$("#tabbar");
  tb.insertAdjacentHTML("beforeend",TABS.filter(t=>!t.header).map(t=>`<button type="button" data-tab="${t.id}">${ic(t.ic)}<span>${t.l}</span><span class="dot" id="dot-${t.id}" hidden></span></button>`).join("")
    +`<button type="button" class="tab-pos" id="tabPos" aria-label="タブの位置を切り替える（下・右）"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M16 4v16"/></svg><span>位置</span></button>`);
  tb.addEventListener("click",e=>{const p=e.target.closest("#tabPos");if(p){setTabPos(document.documentElement.dataset.tabbar==="side"?"bottom":"side");return}
    const b=e.target.closest("button[data-tab]");if(!b)return;go(b.dataset.tab)});
  addEventListener("resize",()=>placeLens(false));
}
// タブの位置：下（いつもの）／右（縦に並べる。折りたたみの iPhone や片手で親指が届く位置）。端末ごとに覚える
function setTabPos(pos){
  if(pos==="side")document.documentElement.dataset.tabbar="side";else delete document.documentElement.dataset.tabbar;
  try{localStorage.setItem("mm-tabpos",pos)}catch(_){}
  requestAnimationFrame(()=>placeLens(false));
}
function placeLens(anim){
  const tb=$("#tabbar"),b=tb.querySelector(`button[data-tab="${S.tab}"]`),lens=tb.querySelector(".lens");
  lens.style.opacity=b?"1":"0";if(!b)return;
  tb.classList.toggle("no-anim",!anim);
  lens.style.width=b.offsetWidth+"px";lens.style.height=b.offsetHeight+"px";
  lens.style.transform=`translate(${b.offsetLeft}px,${b.offsetTop-3}px)`;
}
function go(id,back){
  if(!back&&S.tab!==id){S.hist.push(S.tab);if(S.hist.length>20)S.hist.shift()}
  closeIslandPanel();
  S.tab=id;try{localStorage.setItem("mm-tab",id)}catch(_){}
  render();placeLens(true);scrollTo({top:0});
}

/* ---------- 描画 ---------- */
function render(){
  document.querySelectorAll("#tabbar button[data-tab]").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const ibb=$("#inboxBtn");if(S.tab==="inbox")ibb.setAttribute("aria-current","page");else ibb.removeAttribute("aria-current");
  renderAuto();updBack();
  const tasks=buildTasks();
  const due=tasks.filter(t=>!t.done&&diff(t.date)<=0&&diff(t.date)>=-14).length;
  const dot=$("#dot-home");if(dot){dot.hidden=!due;dot.textContent=due}
  const ib=openInbox().length,dot2=$("#dot-inbox");if(dot2){dot2.hidden=!ib;dot2.textContent=ib}
  const T=TABS.find(t=>t.id===S.tab);
  const head=`<div class="d-head"><p><span class="en">${esc(T.en)}</span><span class="num mono hd-date">${fmt(today())}</span></p><h1>${esc(T.title)}</h1></div>`;
  if(!S.ready){$("#page").innerHTML=head+`<div class="d-card d-empty">データを読み込んでいます。</div>`;return}
  renderIsland();
  const body={home:viewHome,inbox:viewInbox,events:viewEvents,articles:viewArticles,archive:viewArchive,agents:viewAgents,sns:viewSns,kpi:viewKpi}[S.tab](tasks);
  $("#page").innerHTML=head+body;
  bind();
}

function strip(){
  const up=S.events.map(e=>({e,d:parse(e.date)})).filter(x=>x.d&&diff(x.d)>=-1&&x.e.status!=="終了").sort((a,b)=>a.d-b.d).slice(0,4);
  if(!up.length) return `<div class="d-card d-empty">日付の決まったイベントはまだありません。「イベント」タブで追加すると、ここにカウントダウンが出ます。</div>`;
  return `<div class="strip">${up.map(({e,d})=>`<button type="button" class="tminus" data-p="${esc(e.pillar)}" data-edit="event" data-id="${esc(e._id)}">
    <div class="pills">${ppill(e.pillar)}${spill(e.status,EV_STATUS)}</div>
    <div class="t">${tlabel(diff(d))}</div><div class="n">${esc(e.title)}</div>
    <div class="s num">${fmt(d)} ${esc(e.time||"")}・${esc(e.place||"")}</div></button>`).join("")}</div>`;
}

function taskRow(t){
  const n=diff(t.date),late=!t.done&&n<0;
  const lead=t.kind==="upd"
    ?`<button type="button" class="chk" data-chk="${esc(t.a._id)}" data-k="${esc(t.key)}" aria-pressed="${t.done}" aria-label="完了にする" ${S.canWrite?"":"disabled"}>${ic("check","i")}</button>`
    :picto(t.a.pillar);
  return `<div class="d-row ${late?"late":""} ${t.done?"done":""}">${lead}
    <div class="d-main"><div class="d-t">${esc(t.a.title)}</div><div class="d-sub">${t.kind==="pub"?'<span class="d-pill warn">公開</span> ':""}${esc(t.text)}</div></div>
    <div class="d-when">${fmt(t.date)}<br>${t.kind==="upd"?tlabel(-Number(t.key)):"公開期限"}</div></div>`;
}
function group(title,list,emptyMsg){
  return `<div><div class="d-group-title"><span>${title}</span><span class="num">${list.filter(t=>!t.done).length}件</span></div>
    <div class="d-group">${list.length?list.map(taskRow).join(""):`<div class="d-empty">${emptyMsg}</div>`}</div></div>`;
}

function viewHome(tasks){
  const win=tasks.filter(t=>diff(t.date)<=7&&diff(t.date)>=-14);
  const late=win.filter(t=>!t.done&&diff(t.date)<0),now=win.filter(t=>diff(t.date)===0),soon=win.filter(t=>diff(t.date)>0);
  const counts=AR_STATUS.map(s=>[s,S.articles.filter(a=>ast(a)===s).length]);
  const pubN=counts[4][1]+counts[5][1];
  return `${agentsCard("all")}${strip()}
  <div class="d-grid2">
    <div class="stack">${inboxPeek()}${draftGroup()}${group("遅れている作業",late,"遅れはありません。")}${group("今日",now,"今日が期限の作業はありません。")}${group("この先7日",soon,"7日以内の作業はありません。")}</div>
    <div class="stack">
      <div><div class="d-sec"><h2>記事の進み具合</h2><p>90日で20本</p></div>
        <div class="d-stats">${counts.map(([s,n])=>`<div class="d-stat"><span class="k">${s}</span><span class="v">${n}<small>本</small></span></div>`).join("")}</div>
        <div class="d-card" style="margin-top:12px"><div class="d-sec" style="margin:0"><h2 style="font-size:17px">公開 ${pubN} / 20本</h2><p class="num">${Math.round(pubN/20*100)}%</p></div>
        <div class="d-bar"><i style="width:${Math.min(100,pubN/20*100)}%"></i></div></div></div>
      <div><div class="d-sec"><h2>最新のKPI</h2><p>${latestKpi()?esc(latestKpi()._id):"未記録"}</p></div>${kpiTiles(latestKpi(),4)}</div>
    </div></div>`;
}

function viewEvents(){
  const f=S.filter.pillar,mode=S.evMode||"list";
  const list=S.events.filter(e=>f==="all"||e.pillar===f).sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
  return `${agentsCard("events")}<div class="d-actions">${seg()}<span style="flex:1"></span><div class="d-seg" role="group" aria-label="表示">${[["list","リスト"],["cal","カレンダー"]].map(([k,l])=>`<button type="button" data-evmode="${k}" aria-pressed="${mode===k}">${l}</button>`).join("")}</div>${S.canWrite?`<button type="button" class="d-btn small secondary" data-job="watch">${ic("eye")}公式を確認</button>`:""}${addBtn("event","イベントを追加")}</div>
  ${mode==="cal"?evCalendar(list):evList(list)}`;
}
function evList(list){
  return `<div class="d-group">${list.length?list.map(e=>{const d=parse(e.date);return `<button type="button" class="d-row" data-edit="event" data-id="${esc(e._id)}">${picto(e.pillar)}
    <div class="d-main"><div class="d-t">${esc(e.title)}</div><div class="d-sub">${esc(e.place||"")}${e.note?"・"+esc(e.note):""}</div>
    <div class="pills" style="margin-top:4px">${spill(e.status,EV_STATUS)}${e.source?`<a class="d-pill info" href="${esc(e.source)}" target="_blank" rel="noopener">出典</a>`:""}${(e.history||[]).length?`<span class="d-pill warn">変更 ${e.history.length}回</span>`:""}${e.by==="eventfetch"?'<span class="d-pill info">AIが追加</span>':""}${e.checkedAt?`<span class="d-pill mute">公式確認 ${ago(e.checkedAt)}</span>`:""}</div></div>
    <div class="d-when">${d?fmt(d):esc(e.dateText||"未定")}<br>${d?`<b class="mono">${tlabel(diff(d))}</b>`:""}${e.time?"<br>"+esc(e.time):""}</div></button>`}).join("")
    :`<div class="d-empty">イベントはまだありません。</div>`}</div>`;
}
// カレンダー：月ごと。イベントはカテゴリの色、記事の公開期限と SNS の投稿予定も小さく出す
function evCalendar(list){
  const t=today(),base=S.evMonth?new Date(S.evMonth+"T00:00:00"):new Date(t.getFullYear(),t.getMonth(),1);
  const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),start=addDays(first,-first.getDay()),last=new Date(y,m+1,0);
  const weeks=Math.ceil((first.getDay()+last.getDate())/7),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const byDay={};for(const e of list){if(e.date)(byDay[e.date]=byDay[e.date]||[]).push(e)}
  const posts={};for(const p of S.posts){if(p.date)(posts[p.date]=posts[p.date]||0,posts[p.date]++)}
  const cells=[];for(let i=0;i<weeks*7;i++){const d=addDays(start,i),k=key(d),evs=byDay[k]||[],out=d.getMonth()!==m,isT=diff(d)===0;
    cells.push(`<div class="cal-d ${out?"out":""} ${isT?"today":""} ${d.getDay()===0?"sun":d.getDay()===6?"sat":""}"><span class="cal-n num">${d.getDate()}</span>
      ${evs.map(e=>`<button type="button" class="cal-ev cat-${PILLAR[e.pillar]&&e.pillar!=="other"?e.pillar:"other"} ${e.status==="延期"||e.status==="中止"?"is-bad":""}" data-edit="event" data-id="${esc(e._id)}" title="${esc(e.title)} ${esc(e.time||"")}">${esc(e.title)}</button>`).join("")}
      ${posts[k]?`<span class="cal-post">SNS ${posts[k]}</span>`:""}</div>`)}
  const inMonth=list.filter(e=>{const d=parse(e.date);return d&&d.getFullYear()===y&&d.getMonth()===m});
  return `<div class="d-card cal"><div class="cal-bar"><span class="en" style="margin-right:6px">CALENDAR</span><button type="button" class="text-btn" data-evmonth="-1" aria-label="前の月">‹</button><b class="num">${y}年${m+1}月</b><button type="button" class="text-btn" data-evmonth="1" aria-label="次の月">›</button>
      <button type="button" class="d-btn small secondary" data-evmonth="0">今月</button></div>
    <div class="cal-g">${[..."日月火水木金土"].map((w,i)=>`<div class="cal-w ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("")}${cells.join("")}</div></div>
  <div class="cal-list">${inMonth.length?evList(inMonth):""}</div>
  ${list.some(e=>!e.date)?`<div><div class="d-group-title"><span>日付未定</span></div>${evList(list.filter(e=>!e.date))}</div>`:""}`;
}
function seg(){return `<div class="d-seg" role="group" aria-label="柱で絞り込む">${[["all","すべて"],...Object.entries(PILLAR).filter(([k])=>k!=="other"&&k!=="news")].map(([k,l])=>`<button type="button" data-filter="${k}" aria-pressed="${S.filter.pillar===k}">${l}</button>`).join("")}</div>`}

const CATS=["launch","sky","spot","gear"];
const catLegend=()=>`<div class="cat-legend">${CATS.map(k=>`<span class="cat-${k}"><i></i>${PILLAR[k]}</span>`).join("")}</div>`;
const PRI_RANK={"高":0,"中":1,"低":2};
function planKc(a){const pl=a.plan||{},as=a.assess;
  return `${pl.priority?`<span class="kc ${pl.priority==="高"?"kc-bad":pl.priority==="中"?"kc-warn":""}" title="${esc(pl.reason||"")}">優先 ${esc(pl.priority)}</span>`:""}${as&&as.score!=null?`<span class="kc ${as.grade==="OK"?"":"kc-bad"}" title="${esc((as.notes||[]).join(" / "))}">査定 ${esc(as.score)}</span>`:pl.priority?`<span class="kc">査定待ち</span>`:""}`}
const planSort=(x,y)=>((PRI_RANK[(x.plan||{}).priority]??3)-(PRI_RANK[(y.plan||{}).priority]??3))||(((y.assess||{}).score??-1)-((x.assess||{}).score??-1))||((x.priority??999)-(y.priority??999));
function kcard(a,s){
  const pub=pubDate(a),ev=parse(a.eventDate),late=pub&&diff(pub)<0,near=pub&&!late&&diff(pub)<=3,cat=PILLAR[a.pillar]&&a.pillar!=="other"?a.pillar:"other";
  return `<button type="button" class="d-kcard cat-${cat}" data-edit="article" data-id="${esc(a._id)}">
    <div class="t">${a.priority!=null?`<span class="num" style="color:var(--label-3)">#${esc(a.priority)} </span>`:""}${esc(a.title)}</div>
    <div class="pills"><span class="kc kc-${esc(cat)}">${PILLAR[a.pillar]||"その他"}</span>
    ${pub?`<span class="kc ${late?"kc-bad":near?"kc-warn":""}">公開 ${fmt(pub)}</span>`:""}
    ${ev?`<span class="kc">本番 ${fmt(ev)}</span>`:""}${s==="企画中"?planKc(a):loopKc(a)}</div>
    ${a.path?`<div class="kc mono" title="${esc(a.path)}">${esc(a.path)}</div>`:""}</button>`;
}
// 記事選定：期間と本数を決めて、企画から下書きに回す（記事選定エージェントに頼む）
function selForm(){const c=S.selConf||{},can=S.canWrite,stock=CATS.map(k=>[k,S.articles.filter(a=>ast(a)==="企画中"&&a.pillar===k&&!(a.assess&&a.assess.grade==="NG")).length]);
  return `<div class="d-card sel-card"><div class="sel-row"><span class="en" style="margin-right:2px">SELECT</span><b>記事選定</b>
    <label class="sel-f">期間<select id="selDays" ${can?"":"disabled"}>${[[7,"1週間"],[14,"2週間"],[30,"1か月"],[60,"2か月"]].map(([v,l])=>`<option value="${v}" ${+c.days===v?"selected":""}>今日から${l}</option>`).join("")}</select></label>
    <label class="sel-f">本数<input id="selCount" type="number" min="1" max="10" value="${esc(c.count||3)}" ${can?"":"disabled"}></label>
    <label class="sel-f sel-chk"><input id="selAuto" type="checkbox" ${c.auto?"checked":""} ${can?"":"disabled"}>毎日この条件で選ぶ</label>
    <span style="flex:1"></span>${can?`<button type="button" class="d-btn small" id="selGo">選定を頼む</button>`:""}</div>
    <div class="sel-stock">${stock.map(([k,n])=>`<span class="cat-${k} ${n<(c.minStock||3)?"low":""}"><i></i>${PILLAR[k]} ${n}</span>`).join("")}<span class="d-sub">企画の残り（${c.minStock||3}件を切ると、記事選定が企画を頼みます）</span></div></div>`}
function bindSel(pg){pg.querySelectorAll("[data-plan-more]").forEach(b=>b.onclick=()=>{const k=b.dataset.planMore;S.planOpen={...(S.planOpen||{}),[k]:!(S.planOpen||{})[k]};render()});
  const go=pg.querySelector("#selGo");if(!go)return;
  const val=()=>({days:+$("#selDays").value||14,count:Math.max(1,Math.min(10,+$("#selCount").value||3)),auto:$("#selAuto").checked});
  const save=async()=>{const v=val();try{await S.db.doc("settings/selection").set({...S.selConf,...v,updatedAt:iso()})}catch(_){}return v};
  pg.querySelector("#selAuto").onchange=async()=>{await save();toast($("#selAuto").checked?"毎日この条件で選びます":"毎日の選定を止めました")};
  go.onclick=async()=>{go.disabled=true;const v=await save();const from=ymd(today()),to=ymd(addDays(today(),v.days));
    await requestJob("select",{title:`記事選定（${from}〜${to}・${v.count}本）`,from,to,days:v.days,count:v.count,note:`${from}〜${to}に公開する記事を${v.count}本選ぶ`});go.disabled=false}}
function viewArticles(){
  const f=S.filter.pillar,list=S.articles.filter(a=>f==="all"||a.pillar===f).sort((a,b)=>(a.priority??999)-(b.priority??999));
  const plan=list.filter(a=>ast(a)==="企画中").sort(planSort),held=S.articles.filter(a=>a.status==="保留").length,cats=[...CATS,...(plan.some(a=>!CATS.includes(a.pillar))?["other"]:[])].filter(k=>f==="all"||k===f);
  // 企画はカテゴリごとの列。5枚以上なら4枚だけ見せて折りたたむ
  const PFOLD=4,pcol=(k,items)=>{const open=(S.planOpen||{})[k],fold=items.length>PFOLD,shown=fold&&!open?items.slice(0,PFOLD):items;
    return `<section class="d-col cat-col cat-${k}"><h3><span class="cat-name cat-${k}"><i></i>${PILLAR[k]}</span><span class="num">${items.length}</span></h3>${items.length?shown.map(a=>kcard(a,"企画中")).join(""):`<div class="d-empty" style="padding:12px 4px">なし</div>`}
      ${fold?`<button type="button" class="text-btn plan-more" data-plan-more="${k}">${open?"たたむ":`あと${items.length-PFOLD}件を見る`}</button>`:""}</section>`};
  const col=(title,items,cls="")=>`<section class="d-col ${cls}"><h3>${title}<span class="num">${items.length}</span></h3>${items.length?items.map(a=>kcard(a,ast(a))).join(""):`<div class="d-empty" style="padding:12px 4px">なし</div>`}</section>`;
  return `${agentsCard("article")}<div class="d-actions">${seg()}<span style="flex:1"></span>${S.canWrite?`<button type="button" class="d-btn small secondary" data-job="plan">${ic("idea")}企画を頼む</button>`:""}${addBtn("article","記事を追加")}</div>
  ${catLegend()}
  <div class="plan-wrap"><div class="d-sec"><h2 style="font-size:19px"><span class="en-l">PLANNING</span>企画</h2>${held?`<button type="button" class="text-btn" data-go="inbox" style="font-size:14px">保留 ${held}件（受信箱）</button>`:""}</div>
    ${selForm()}
    <div class="d-board cats ${cats.length>1?"scroll":""}" style="--n:${cats.length}">${cats.map(k=>pcol(k,plan.filter(a=>(CATS.includes(a.pillar)?a.pillar:"other")===k))).join("")}</div></div>
  <div><div class="d-sec"><h2 style="font-size:19px"><span class="en-l">IN PROGRESS</span>進行中</h2></div>
    <div class="d-board n3">${["下書き","査読中","公開待ち"].map(st=>col(st,list.filter(a=>ast(a)===st))).join("")}</div></div>`;
}
function viewArchive(){
  const f=S.filter.pillar,list=S.articles.filter(a=>isPub(a)&&(f==="all"||a.pillar===f));
  const key=a=>a.publishedAt||a.lastVerified||"";
  const need=list.filter(a=>ast(a)==="要更新"||(a.updateDraft&&!a.updateDraft.applied)).sort((x,y)=>key(y).localeCompare(key(x)));

  const row=a=>{const lv=parse(a.lastVerified),ev=parse(a.eventDate),u=a.url||(a.path?"https://miagetabi.space"+a.path:"");

    return `<button type="button" class="d-row" data-edit="article" data-id="${esc(a._id)}">${picto(a.pillar)}

function postWhen(p){const d=parse(p.date),n=d?diff(d):null,past=n!=null&&n<0&&p.status!=="投稿済み";
  return `<div class="sv-when ${n===0?"today":""} ${past?"late":""}"><b class="num">${esc(p.time||"--:--")}</b><span>${d?fmt(d):"日付なし"}${d?" · "+relDay(d):""}</span><em>${esc(p.channel||"X")}${p.kind?"・"+esc(p.kind):""}</em></div>`}

function xCard(p){const n=xLen(p.text),d=parse(p.date);
  return `<button type="button" class="sv sv-x" data-edit="post" data-id="${esc(p._id)}">${postWhen(p)}<div class="sv-head">${snsAvatar}<div class="sv-who"><b>ミアゲタビ</b><span>@${esc(xHandle())}</span></div><span class="sv-logo">𝕏</span></div>
    <div class="sv-text">${snsText(p.text)||'<span class="d-sub">（本文なし）</span>'}</div>
    ${(()=>{const u=postImg(p);return u?`<div class="sv-ximg"><img src="${esc(u)}" alt="" loading="lazy"></div>`:""})()}${postImgBar(p)}
    <div class="sv-count ${n>280?"over":""}"><i style="--p:${Math.min(100,n/280*100)}%"></i><span class="num">${n}/280</span></div>${postMeta(p)}</button>`}
function igCard(p){const tags=(String(p.text||"").match(/[#＃][^\s#＃　]+/g)||[]).length,d=parse(p.date),cap=String(p.text||"");
  return `<button type="button" class="sv sv-ig" data-edit="post" data-id="${esc(p._id)}">${postWhen(p)}<div class="sv-head">${snsAvatar}<div class="sv-who"><b>${esc(igHandle())}</b><span>ミアゲタビ</span></div><span class="sv-logo ig">◎</span></div>
    <div class="sv-img">${(()=>{const u=postImg(p);return u?`<img src="${esc(u)}" alt="" loading="lazy">`:`<span>${p.imageId||p.status==="審査済み"?"画像担当が画像を作っています":esc(p.imageNote||"審査を通ると画像担当が画像を作ります")}<br><b>画像のURLを入れると予約できます</b></span>`})()}</div>${postImgBar(p)}
    <div class="sv-text"><b>${esc(igHandle())}</b> ${snsText(cap.length>150?cap.slice(0,150)+"…":cap)}${cap.length>150?' <span class="d-sub">もっと見る</span>':""}</div>
    <div class="sv-count ${tags!==8&&tags?"over":""}"><span class="num">${[...cap].length}/300字 · タグ ${tags}/8</span></div>${postMeta(p)}</button>`}
/* ---------- Metricool で予約（運営者がワンタップ。審査済みの投稿だけ） ---------- */
const METRICOOL="Metricool Social Media Management";
const MC_NET={X:"twitter",Instagram:"instagram"};
const xHandle=()=>(S.snsConf.xHandle||"").replace(/^@/,"")||"（未設定）";
const igHandle=()=>(S.snsConf.igHandle||"").replace(/^@/,"")||"（未設定）";
const mcPayload=r=>{let p=r&&(r.payload!==undefined?r.payload:r.json);if(typeof p==="string"){try{p=JSON.parse(p)}catch(_){}}return p};
function mcProblems(p){const out=[],d=parse(p.date);
  if(!S.snsConf.brandId)out.push("Metricool のブランドが未設定（SNS タブの「アカウント」）");
  if(p.channel==="両方")out.push("「両方」は予約できません。X と Instagram の投稿に分けてください");
  if(!d||!/^\d{1,2}:\d{2}$/.test(p.time||""))out.push("投稿日と時刻（例 19:00）が必要");
  else if(new Date(`${p.date}T${p.time.padStart(5,"0")}:00+09:00`)<new Date(Date.now()+5*6e4))out.push("投稿の時刻が過ぎています（5分以上先にしてください）");
  if(p.channel==="Instagram"&&!/^https:\/\//.test(p.imageUrl||""))out.push("Instagram は画像の URL が必要");
  if(p.channel==="X"&&xLen(p.text)>280)out.push("X の文字数が280を超えています");
  return out}
function mcAction(p){
  if(p.status==="予約済み"&&p.metricool)return `<div class="sv-act"><span class="d-pill info">Metricool に予約済み</span>${p.metricool.plannerUrl?`<a class="d-pill mute" href="${esc(p.metricool.plannerUrl)}" target="_blank" rel="noopener">Metricool で開く</a>`:""}</div>`;
  if(p.status!=="審査済み"||!S.canWrite)return "";
  const pr=mcProblems(p),busy=S.mcBusy===p._id,armed=S.mcArm===p._id;
  return `<div class="sv-act">${pr.length?`<span class="sv-warn">${esc(pr[0])}</span>`:`<span class="d-sub">審査に通りました</span>`}
    <span role="button" tabindex="0" class="d-btn small ${armed?"":"secondary"} ${pr.length||busy||!S.mcp?"is-dis":""}" data-mc="${esc(p._id)}">${busy?"予約しています…":armed?"もう一度押すと予約":"Metricool に予約"}</span></div>`;
}
async function mcSchedule(id){
  const p=S.posts.find(x=>x._id===id);if(!p||S.mcBusy)return;
  if(!S.mcp){toast("コネクタが使えません");return}
  const pr=mcProblems(p);if(pr.length){toast(pr[0]);return}
  if(S.mcArm!==id){S.mcArm=id;render();setTimeout(()=>{if(S.mcArm===id){S.mcArm=null;render()}},5000);return}
  S.mcArm=null;S.mcBusy=id;render();
  const net=MC_NET[p.channel],at=`${p.date}T${p.time.padStart(5,"0")}`;
  try{
    // 選んだブランドに、その媒体がつながっているかを確かめる（ほかのブランドには予約しない）
    const bl=(mcPayload(await S.mcp.callTool(METRICOOL,"getBrandSettings",{},{cache:false}))||{}).data||[];
    const brand=bl.find(b=>String(b.id)===String(S.snsConf.brandId));
    if(!brand)throw {code:"tool_error",message:"設定したブランドが Metricool に見つかりません"};
    if(!(brand.networksData||{})[net+"Data"])throw {code:"tool_error",message:`ブランド「${brand.label}」に ${p.channel} がつながっていません`};
    // 同じ時刻・同じ文の予約が既にあれば作らない（二重予約の防止）
    const near=(mcPayload(await S.mcp.callTool(METRICOOL,"getScheduledPosts",{brandId:String(brand.id),fromDate:at+":00+09:00",toDate:at+":59+09:00",timezone:"Asia/Tokyo",extendedRange:true},{cache:false}))||{}).data||[];
    const norm=t=>String(t||"").replace(/\s+/g,"").slice(0,60);
    let dup=near.find(x=>(x.providers||[]).some(v=>v.network===net)&&norm(x.text)===norm(p.text));
    let uuid=dup?String(dup.uuid||""):"",url="";
    if(!dup){
      const info={autoPublish:true,draft:false,descendants:[],firstCommentText:"",hasNotReadNotes:false,media:/^https:\/\//.test(p.imageUrl||"")?[p.imageUrl]:[],mediaAltText:[],providers:[{network:net}],
        publicationDate:{dateTime:at+":00",timezone:"Asia/Tokyo"},shortener:false,smartLinkData:{ids:[]},text:p.text};
      if(net==="twitter")info.twitterData={tags:[]};
      if(net==="instagram")info.instagramData={type:"POST",isAiGenerated:false};
      const res=await S.mcp.callTool(METRICOOL,"createScheduledPost",{blogId:String(brand.id),date:at+":00+09:00",info:JSON.stringify(info)},{cache:false});
      const raw=JSON.stringify(res.payload??res.content??"");
      const m=raw.match(/https:\/\/[^"\\\s]*openWithPostUuid=(-?\d+)[^"\\\s]*/);
      url=m?m[0]:"";uuid=m?m[1]:"";
    }
    if(!url&&uuid)url=`https://app.metricool.com/planner/calendar?blogId=${brand.id}&openWithPostUuid=${uuid}`;
    await S.db.doc("posts/"+id).update({status:"予約済み",updatedAt:iso(),metricool:{blogId:String(brand.id),uuid,plannerUrl:url,scheduledAt:iso(),linked:!!dup}});
    toast(dup?"同じ予約が Metricool にあったので、それを記録しました":"Metricool に予約しました");
  }catch(e){toast("予約できませんでした："+String((e&&e.message)||e&&e.code||"").slice(0,120))}
  finally{S.mcBusy=null;render()}
}
// 予約の時刻を過ぎ、Metricool の予約一覧から消えたものを「投稿済み」にする（SNS タブを開いたとき。10分に1回まで）
async function mcSync(){
  if(!S.mcp||!S.canWrite||!S.snsConf.brandId||Date.now()-(S.mcSyncAt||0)<6e5)return;S.mcSyncAt=Date.now();
  const due=S.posts.filter(p=>p.status==="予約済み"&&p.metricool&&new Date(`${p.date}T${(p.time||"00:00").padStart(5,"0")}:00+09:00`)<new Date(Date.now()-10*6e4));
  if(!due.length)return;
  try{const d0=due.map(p=>p.date).sort()[0];
    const left=(mcPayload(await S.mcp.callTool(METRICOOL,"getScheduledPosts",{brandId:String(S.snsConf.brandId),fromDate:d0+"T00:00:00+09:00",toDate:new Date().toISOString().slice(0,10)+"T23:59:59+09:00",timezone:"Asia/Tokyo",extendedRange:true},{cache:false}))||{}).data||[];
    const ids=new Set(left.map(x=>String(x.uuid)));
    for(const p of due)if(p.metricool.uuid&&!ids.has(String(p.metricool.uuid)))await S.db.doc("posts/"+p._id).update({status:"投稿済み",postedAt:iso(),updatedAt:iso()});
  }catch(_){}
}

const ROLES=Object.keys(AG);
const roleOf=kind=>ROLES.find(r=>AG[r].kinds.includes(kind))||"writer";
const KIND_L={select:"記事選定",eventfetch:"イベント取得",eyecatch:"アイキャッチ",snsimage:"SNS画像",article:"作成",update:"直し",review:"査読",plan:"企画",watch:"公式ウォッチ",sns:"SNS",snsreview:"SNS審査",audit:"点検"};
const LOOP={writing:["執筆中","info"],reviewing:["査読中","info"],passed:["合格","good"],failed:["判断待ち","bad"]};
const JOB_ST={queued:["順番待ち","mute"],running:["作業中","good"],done:["完了","info"],waiting:["判断待ち","warn"],error:["失敗","bad"]};
const iso=()=>new Date().toISOString();
const stamp=()=>{const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}`};
function ago(t){const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?"たった今":m<60?m+"分前":m<1440?Math.round(m/60)+"時間前":Math.round(m/1440)+"日前"}
const loopKc=a=>a.loop&&LOOP[a.loop.state]?`<span class="kc ${a.loop.state==="failed"?"kc-bad":a.loop.state==="passed"?"":"kc-warn"}">${LOOP[a.loop.state][0]}${a.loop.round?" "+a.loop.round+"回目":""}</span>`:"";
const loopPill=a=>a.loop&&LOOP[a.loop.state]?`<span class="d-pill ${LOOP[a.loop.state][1]}">${LOOP[a.loop.state][0]}${a.loop.round?"・"+a.loop.round+"回目":""}</span>`:'<span class="d-pill mute">まだ依頼していません</span>';
const gradePill=r=>r&&r.grade?`<span class="d-pill ${r.grade==="A"?"good":r.grade==="B"?"warn":"bad"}">査読 ${esc(r.grade)}（P0 ${r.p0??"-"}・P1 ${r.p1??"-"}・P2 ${r.p2??"-"}）</span>`:"";
const jobLabel=j=>`${KIND_L[j.kind]||j.kind}${j.kind==="review"&&j.mode&&j.mode!=="draft"?(j.mode==="update"?"（直し）":"（公開済みの点検）"):""}${j.round&&(j.kind==="article"||j.kind==="review")&&(!j.mode||j.mode==="draft")?" "+j.round+"回目":""}`;

function mcpErr(e){
  const c=e&&e.code;
  return ({server_not_connected:"Claude Code Remote のコネクタが見つかりません。claude.ai の設定 → コネクタで追加してください",
    needs_reauth:"Claude Code Remote のコネクタをつなぎ直してください（claude.ai の設定 → コネクタ）",
    not_in_manifest:"このページでのコネクタの利用が許可されていません。ページの「権限」から許可してください",
    approval_required:"コネクタを使う許可が必要です。表示された確認で「許可」を選んでください",
    selection_required:"同じ名前のコネクタが複数あります。どれを使うか選んでください",
    blocked_by_policy:"組織の設定でこのコネクタは使えません",
    server_unavailable:"いまコネクタにつながりません。少し待ってからもう一度押してください",
    tool_error:"起動を断られました："+((e&&e.message)||"").slice(0,80)})[c]||("起動できませんでした（"+(c||"不明")+"）");
}
// Routine を起動する。jobId があれば「job:<ID>」を渡す（無ければ定時と同じ見回り）
async function fire(role,jobId){
  const trig=S.bg[AG[role].trig];
  if(!S.mcp) return {ok:false,why:"このページではコネクタが使えません。依頼は順番待ちのまま残り、定時の見回りで処理されます"};
  if(!trig) return {ok:false,why:`${AG[role].l}の Routine の ID が未設定です（編集部 → 設定）`};
  try{
    await S.mcp.callTool(S.bg.server||"Claude Code Remote","fire_trigger",jobId?{trigger_id:trig,text:"job:"+jobId}:{trigger_id:trig},{cache:false});
    if(jobId) S.db.doc("jobs/"+jobId).update({kickedAt:iso()}).catch(()=>{});
    return {ok:true};
  }catch(e){return {ok:false,why:mcpErr(e)}}
}
const busy=(kind,key,val)=>S.jobs.some(j=>j.kind===kind&&(j.status==="queued"||j.status==="running")&&(!key||j[key]===val));
// 依頼を積んで起動する（役割が止まっていれば積むだけ）
async function enqueue(id,job){
  const now=iso(),role=roleOf(job.kind);
  try{await S.db.doc("jobs/"+id).set({status:"queued",message:"依頼しました",by:"app",createdAt:now,updatedAt:now,...job})}
  catch(e){toast("依頼を書けませんでした："+(e.message||e.code));return false}
  if(S.pause[role]){toast(`${AG[role].l}は停止中です。再開すると始まります`);return true}
  const r=await fire(role,id);toast(r.ok?`${AG[role].l}エージェントを起動しました`:r.why);return true;
}
async function requestJob(kind,extra){
  if(!S.canWrite||!S.db) return;
  if(busy(kind,extra&&extra.articleId?"articleId":null,extra&&extra.articleId)){toast("同じ依頼がもう進んでいます");return}
  const id=`${kind}-${(extra&&extra.articleId)||"app"}-${stamp()}`;
  await enqueue(id,{kind,title:(extra&&extra.title)||KIND_L[kind],...(extra||{})});
}
async function requestWrite(a,opt){
  if(!S.canWrite||!S.db) return;
  const round=((a.loop&&a.loop.round)||0)+1,id=`article-${a._id}-${round}`,now=iso();
  const replace=isPub(a);
  const ok=await enqueue(id,{kind:"article",articleId:a._id,round,title:a.title||"",withExperience:!!opt.withExperience,note:opt.note||(replace?"公開中の記事の差し替え稿（article-manual.md の 10 章）":""),rewrite:round>1,...(replace?{replace:true}:{})});
  if(!ok) return;
  try{await S.db.doc("articles/"+a._id).update({loop:{state:"writing",round,max:S.loopConf.maxRounds||5,updatedAt:now,...(replace?{replace:true}:{})},withExperience:!!opt.withExperience,...(ast(a)==="企画中"?{status:"下書き"}:{})})}catch(_){}
}
async function retryJob(j){
  try{await S.db.doc("jobs/"+j._id).update({status:"queued",message:"もう一度依頼しました",updatedAt:iso()})}catch(e){toast("書けませんでした："+(e.message||e.code));return}
  const role=roleOf(j.kind);if(S.pause[role]){toast("停止中です。再開すると始まります");return}
  const r=await fire(role,j._id);toast(r.ok?"もう一度起動しました":r.why);
}
async function setPause(role,paused){
  const roles={};for(const r of ROLES)roles[r]=S.pauseRaw[r]||{paused:false};roles[role]={paused,at:iso(),by:"owner"};
  try{await S.db.doc("settings/agentPause").set({roles,updatedAt:iso()})}catch(e){toast("保存できませんでした："+(e.message||e.code));return}
  // 定時の起動も止める／戻す（1役割＝1 Routine）。失敗しても db の停止で各エージェントは何もしない
  let note="";const trig=S.bg[AG[role].trig];
  if(S.mcp&&trig){try{await S.mcp.callTool(S.bg.server||"Claude Code Remote","update_trigger",{trigger_id:trig,enabled:!paused},{cache:false})}catch(e){note="（定時の切り替えはできませんでした）"}}
  toast((paused?`${AG[role].l}を止めました`:`${AG[role].l}を再開しました`)+note);
  if(!paused){const waiting=S.jobs.filter(j=>j.status==="queued"&&roleOf(j.kind)===role).reverse();for(const j of waiting.slice(0,3)){await fire(role,j._id)}}
}
// 自動運転（一部停止のときに押すと全員オン、オンのときは2回押すとオフ）：記事（企画・作成・査読・イベント取得・公式ウォッチ・点検）と SNS（SNS・SNS審査）を別々に切り替える。
// 両方オンのときだけ「完全自動運転」（ヘッダーのフチがオレンジに光る）
const GROUPS={article:{l:"記事の自動運転",en:"ARTICLE AUTOPILOT",roles:["planner","selector","writer","reviewer","designer","eventfetch","watch","audit"]},sns:{l:"SNSの自動運転",en:"SOCIAL AUTOPILOT",roles:["sns","snsreview"]}};
function groupState(g){const R=GROUPS[g].roles,on=R.filter(r=>!S.pause[r]).length;return on===R.length?"on":on?"part":"off"}
const fullAuto=()=>S.ready&&!!S.db&&groupState("article")==="on"&&groupState("sns")==="on";
function renderAuto(){const nb=$(".navbar");if(nb)nb.classList.toggle("is-autopilot",fullAuto())}
function autoSwitch(g){
  const st=groupState(g),G=GROUPS[g],label={on:"ON",part:"一部停止",off:"OFF"}[st];
  return `<button type="button" class="auto-sw is-${st}" data-auto="${g}" aria-pressed="${st!=="off"}" ${S.canWrite?"":"disabled"} title="${esc(G.l)}：${G.roles.map(r=>AG[r].l).join("・")}">
    <span class="en">${G.en}</span><span class="auto-row"><i class="tg"></i><b>${label}</b><span class="d-sub">${G.roles.filter(r=>!S.pause[r]).length}/${G.roles.length}</span></span></button>`;
}
async function setGroup(g,on){
  const roles={};for(const r of ROLES)roles[r]=S.pauseRaw[r]||{paused:false};
  for(const r of GROUPS[g].roles)roles[r]=on?{paused:false,at:iso(),by:"auto"}:{paused:true,at:iso(),by:"auto"};
  try{await S.db.doc("settings/agentPause").set({roles,updatedAt:iso()})}catch(e){toast("保存できませんでした："+(e.message||e.code));return}
  let ng=0;
  if(S.mcp)for(const r of GROUPS[g].roles){const trig=S.bg[AG[r].trig];if(!trig)continue;if(on===!S.pause[r])continue;
    try{await S.mcp.callTool(S.bg.server||"Claude Code Remote","update_trigger",{trigger_id:trig,enabled:on},{cache:false})}catch(_){ng++}}
  const other=g==="article"?"sns":"article",full=on&&groupState(other)==="on";
  toast(`${GROUPS[g].l}を${on?"オン":"オフ"}にしました${full?"・完全自動運転":""}${ng?"（定時の切り替えに失敗 "+ng+"件）":""}`);
  if(on)for(const r of GROUPS[g].roles){const w=S.jobs.filter(j=>j.status==="queued"&&roleOf(j.kind)===r).reverse().slice(0,2);for(const j of w)await fire(r,j._id)}
}

// ページを開いたとき、2分以上たっても起動されていない依頼を起動する（30分以内に起動したもの・止まっている役割は除く）。
// Routine どうしは起こし合えないことがあるため、受け渡しの依頼はここで拾う
function kickQueued(){
  if(!S.mcp||!S.canWrite||!S.db) return;
  const now=Date.now();
  S.jobs.filter(j=>j.status==="queued"&&!S.kicked.has(j._id)&&now-new Date(j.createdAt||0)>12e4&&(!j.kickedAt||now-new Date(j.kickedAt)>18e5)&&!S.pause[roleOf(j.kind)])
    .slice(0,3).forEach(j=>{S.kicked.add(j._id);fire(roleOf(j.kind),j._id)});
}
const jobTitle=j=>{const a=S.articles.find(x=>x._id===j.articleId);return a?a.title:(j.title||KIND_L[j.kind]||j._id)};
// デジタルアイランド：いま動いている作業をリアルタイムで（複数あるときは4秒ごとに切り替え）
function renderIsland(){
  const el=$("#island");if(!el)return;
  if(!S.ready||!S.db){el.hidden=true;return}
  const run=S.jobs.filter(j=>j.status==="running").sort((a,b)=>(a.startedAt||"").localeCompare(b.startedAt||"")),q=S.jobs.filter(j=>j.status==="queued").length;
  el.hidden=false;el.classList.toggle("is-run",!!run.length);el.classList.toggle("is-auto",fullAuto());
  if(!run.length){el.innerHTML=`<i class="idle"></i><span class="isl-txt">${fullAuto()?'<b class="isl-ap">AUTOPILOT</b>':""}${q?`順番待ち ${q}`:"待機中"}</span>`}
  else{const j=run[Math.floor(Date.now()/4000)%run.length],r=roleOf(j.kind);
    el.innerHTML=`<span class="isl-ic ag-ic ag-${r}">${ic(AG[r].ic,"")}</span><span class="isl-txt"><b>${esc(AG[r].l)}</b><span class="isl-msg">${esc(j.message||jobLabel(j))}</span></span><span class="isl-el num">${elapsed(j.startedAt||j.createdAt)}</span>${run.length+q>1?`<span class="isl-n num">+${run.length+q-1}</span>`:""}`}
  el.setAttribute("aria-expanded",String(!!$("#islandPanel")));
  el.onclick=e=>{e.stopPropagation();$("#islandPanel")?closeIslandPanel():openIslandPanel()};
}
function fillIslandPanel(){
  const p=$("#islandPanel");if(!p)return;
  const list=[...S.jobs.filter(j=>j.status==="running"),...S.jobs.filter(j=>j.status==="queued")];
  p.innerHTML=`<div class="ip-head"><b>動いている依頼</b><button type="button" class="text-btn" data-ip-close>閉じる</button></div>
    <div class="ip-scroll"><div class="d-group">${list.length?list.map(jobRow).join(""):`<div class="d-empty">いま動いている依頼はありません。</div>`}</div></div>`;
  p.querySelector("[data-ip-close]").onclick=closeIslandPanel;
  bindJobButtons(p);
}
function openIslandPanel(){
  if($("#islandPanel"))return;
  document.body.insertAdjacentHTML("beforeend",`<div class="ipanel glass" id="islandPanel" role="dialog" aria-label="動いている依頼"></div>`);
  fillIslandPanel();$("#island").setAttribute("aria-expanded","true");updBack();
  setTimeout(()=>addEventListener("click",islandOutside),0);
}
function islandOutside(e){if(!e.target.closest("#islandPanel"))closeIslandPanel()}
function closeIslandPanel(){const p=$("#islandPanel");if(p)p.remove();setTimeout(updBack);removeEventListener("click",islandOutside);const el=$("#island");if(el)el.setAttribute("aria-expanded","false")}

function draftGroup(){
  const list=S.articles.filter(a=>a.draft&&a.loop&&(a.loop.state==="passed"||a.loop.state==="failed")&&(a.loop.replace||(ast(a)!=="公開済み"&&ast(a)!=="要更新")));
  if(!list.length) return "";
  return `<div><div class="d-group-title"><span>エージェントの稿（あなたの確認待ち）</span><span class="num">${list.length}件</span></div>
  <div class="d-group">${list.map(a=>`<button type="button" class="d-row" data-draft="${esc(a._id)}">${picto(a.pillar)}
    <div class="d-main"><div class="d-t">${esc(a.title)}</div><div class="pills" style="margin-top:4px">${loopPill(a)}${gradePill(a.review)}</div></div>
    <div class="d-when">${a.review&&a.review.at?ago(a.review.at):""}</div></button>`).join("")}</div></div>`;
}
function jobRow(j){
  const a=S.articles.find(x=>x._id===j.articleId),st=JOB_ST[j.status]||["?","mute"],A=AG[roleOf(j.kind)];
  return `<div class="d-row"><span class="d-picto pc-${A.pc}">${ic(A.ic,"")}</span>

const IB_KIND={planReview:["企画の見直し","warn","idea"],change:["公式の変化","bad","eye"],loopFailed:["査読で止まった記事","bad","check"],recheck:["公開済みの点検","warn","scan"],question:["エージェントからの質問","warn","doc"],idea:["記事の企画案","info","idea"],audit:["点検の結果","warn","scan"],other:["そのほか","mute","inbox"]};
const IB_EN={planReview:"PLAN REVIEW",change:"OFFICIAL UPDATE",loopFailed:"NEEDS DECISION",recheck:"RECHECK",question:"QUESTION",idea:"IDEAS",audit:"AUDIT",other:"OTHER"};
const IB_ORDER=["change","loopFailed","recheck","question","planReview","idea","audit","other"];
const openInbox=()=>S.inbox.filter(i=>!i.status||i.status==="open").sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));

function inboxCard(it){

    ${it.kind==="idea"&&it.proposal?`<dl class="kv">${[["柱",PILLAR[it.proposal.pillar]||it.proposal.pillar],["URL",it.proposal.path],["キーワード",it.proposal.keyword],["イベント日",it.proposal.eventDate],["公開期限",it.proposal.publishBy],["収益化",it.proposal.monetize],["タグ",(it.proposal.tags||[]).map(t=>TAGS[t]||t).join("・")]].filter(x=>x[1]).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`:""}

function viewInbox(){
  const open=openInbox(),closed=S.inbox.filter(i=>i.status&&i.status!=="open").sort((a,b)=>(b.answeredAt||"").localeCompare(a.answeredAt||"")).slice(0,20);

function nextArticleId(){let n=0;for(const a of S.articles){const m=/^a(\d+)$/.exec(a._id);if(m)n=Math.max(n,+m[1])}return "a"+String(n+1).padStart(2,"0")}
async function ibAct(id,act){
  const it=S.inbox.find(x=>x._id===id);if(!it)return;
  const txt=(inVal("ibn-"+id)||"").trim(),a=S.articles.find(x=>x._id===it.articleId);
  if(act==="event"){openSheet("event",it.eventId);return}
  if(act==="upd"||act==="draft"){openDraft(it.articleId,act==="upd"?"update":"body");return}
  if(act==="adopt"||act==="adoptWrite"){
    const p=it.proposal||{},aid=nextArticleId(),pri=Math.max(0,...S.articles.map(x=>+x.priority||0))+1;
    const card={title:p.title||it.title||"",pillar:p.pillar||"other",tags:p.tags||[],path:p.path||"",template:p.template||"",keyword:p.keyword||"",intent:p.intent||"",
      eventDate:p.eventDate||"",publishBy:p.publishBy||"",monetize:p.monetize||"",priority:p.priority&&!S.articles.some(x=>+x.priority===+p.priority)?+p.priority:pri,
      status:"企画中",note:[txt,"企画エージェントの案（受信箱から採用）"].filter(Boolean).join("\n"),createdAt:iso(),updatedAt:iso()};
    try{await S.db.doc("articles/"+aid).set(card)}catch(e){toast("カードを作れませんでした："+(e.message||e.code));return}
    await logPlanner(card.title,"採用",txt);await markInbox(it,"done","採用 → "+aid);
    toast("記事ボードの「企画中」に入れました");
    if(act==="adoptWrite") await requestWrite({...card,_id:aid},{note:txt});
    return;
  }
  if(act==="planBack"&&a){try{await S.db.doc("articles/"+a._id).update({status:"企画中",assess:{...(a.assess||{}),grade:"OK",override:true,ownerNote:txt,at:iso()},updatedAt:iso()})}catch(e){toast("保存できませんでした");return}await markInbox(it,"done",txt||"企画に戻す");toast("企画中に戻しました");return}
  if(act==="planDrop"&&a){try{await S.db.doc("articles/"+a._id).update({status:"見送り",updatedAt:iso()})}catch(e){toast("保存できませんでした");return}await logPlanner(a.title,"見送り",txt||(it.body||"").slice(0,200));await markInbox(it,"dismissed",txt||"見送り");toast("見送りました");return}
  if(act==="replan"){if(a){try{await S.db.doc("articles/"+a._id).update({status:"見送り",updatedAt:iso()})}catch(_){}}
    await logPlanner(a?a.title:it.title,"見送り",(txt?txt+"／":"")+(it.body||"").slice(0,200));
    await requestJob("plan",{pillar:a&&a.pillar||"",title:"企画の作り直し",note:[`「${a?a.title:it.title}」の代わりの企画を出す（記事選定の査定で不可）`,txt,(it.body||"").slice(0,800)].filter(Boolean).join("\n")});
    await markInbox(it,"done",txt||"作り直しを依頼");return}
  if(act==="dismiss"){if(it.kind==="idea")await logPlanner(it.title,"見送り",txt);if(await markInbox(it,"dismissed",txt))toast("見送りました");return}
  if(act==="done"){if(await markInbox(it,"done",txt))toast("対応済みにしました");return}
  if(act==="answer"){if(!txt){toast("答えを入れてください");return}if(await markInbox(it,"done",txt))toast("答えを保存しました");return}
  if(act==="answerWrite"||act==="rewrite"){
    if(act==="answerWrite"&&!txt){toast("答えを入れてください");return}
    if(!a){toast("記事が見つかりません");return}
    if(busy("article","articleId",a._id)){toast("この記事の依頼がもう進んでいます");return}
    await requestWrite(a,{withExperience:!!a.withExperience,note:act==="answerWrite"?"運営者の答え："+txt:txt});
    await markInbox(it,"done",txt||"もう一度書かせた");return;
  }
  if(act==="ready"&&a){try{await S.db.doc("articles/"+a._id).update({status:"公開待ち",loop:{...(a.loop||{}),state:"passed",updatedAt:iso(),byOwner:true}})}catch(e){toast("保存できませんでした");return}await markInbox(it,"done","この稿で公開待ち");toast("公開待ちにしました");return}
  if(act==="shelve"&&a){try{await S.db.doc("articles/"+a._id).update({status:"企画中",loop:{...(a.loop||{}),state:"failed",updatedAt:iso(),byOwner:true}})}catch(e){toast("保存できませんでした");return}await markInbox(it,"dismissed",txt||"見送り");toast("企画中に戻しました");return}
  if(act==="fix"&&a){await requestJob("update",{articleId:a._id,title:a.title,note:[txt,`受信箱「${it.title}」より`,(it.body||"").slice(0,1500)].filter(Boolean).join("\n")});await markInbox(it,"done","直しを依頼");return}
}

/* 稿の表示（Markdown を読みやすく） */
function mdInline(t){
  let s=esc(t);
  s=s.replace(/\[(AFF:[^\]]+)\]/g,'<span class="mark">$1</span>').replace(/\[(体験記入:[^\]]+)\]/g,'<span class="mark">$1</span>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,l,u)=>`<a href="${u}" target="_blank" rel="noopener">${l}</a>`);
  s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
  return s;
}
const svgUrl=svg=>"data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));
function mdHtml(md,fields,figs){
  let L=String(md||"").replace(/\r\n/g,"\n").split("\n"),out=[],i=0;
  if(L[0]&&L[0].trim()==="---"){const e=L.indexOf("---",1);if(e>0){out.push(`<div class="fm">${esc(L.slice(1,e).join("\n"))}</div>`);L=L.slice(e+1)}}
  const isBlock=x=>/^(#{1,4}\s|[-*]\s|\d+[.)]\s|\||>|\[mm_status\]|:::|最終確認：)/.test(x.trim());
  while(i<L.length){
    const s=L[i].trim();
    if(!s){i++;continue}
    let m=s.match(/^(#{1,4})\s+(.*)$/);
    if(m){const n=Math.max(2,m[1].length);out.push(`<h${n}>${mdInline(m[2])}</h${n}>`);i++;continue}
    const bm=s.match(/^:::(info|point|src|history|fig)\s*(.*)$/);
    if(bm){const body=[];i++;while(i<L.length&&L[i].trim()!==":::"){if(L[i].trim())body.push(L[i].trim());i++}i++;
      const k=bm[1],arg=bm[2];
      if(k==="info")out.push(`<div class="mgx-info"><div class="mgx-h">${esc(arg)}<span>QUICK FACTS</span></div><dl>${body.map(x=>{const q=x.split(/[:：]/);const k2=q.shift();let v=q.join(":").trim(),tag="";const tm=v.match(/^\[(go|delay|sky|stop|done|open)\]\s*/);if(tm){tag=`<b class="mgx-st ${tm[1]}">${tm[1].toUpperCase()}</b>`;v=v.slice(tm[0].length)}return `<dt>${esc(k2)}</dt><dd>${tag}${mdInline(v)}</dd>`}).join("")}</dl></div>`);
      else if(k==="point")out.push(`<div class="mgx-point"><b>${esc(arg)}</b>${mdInline(body.join(""))}</div>`);
      else if(k==="fig"){const fm=arg.match(/^(FIG\.?\s*\d+)\s*(.*)$/);const imgs=body.filter(x=>x.startsWith("@")).map(x=>{const svg=(figs||{})[x.slice(1).trim()];return svg?`<img src="${svgUrl(svg)}" alt="">`:`<div class="d-empty">図：${esc(x.slice(1))}</div>`}).join("");
        out.push(`<figure class="mgx-fig">${imgs}<figcaption>${fm?`<b>${esc(fm[1])}</b>${mdInline(fm[2])}`:mdInline(arg)}</figcaption></figure>`)}
      else out.push(`<div class="mgx-list"><b>${k==="src"?"出典":"更新履歴"}</b><ul>${body.map(x=>`<li>${mdInline(x.replace(/^[-*]\s+/,""))}</li>`).join("")}</ul></div>`);
      continue}
    if(s.startsWith("最終確認：")){out.push(`<p class="mgx-verified">${mdInline(s)}</p>`);i++;continue}
    if(s==="[mm_status]"){const f=fields||{};out.push(`<div class="statusbox">ここに「今の状況」の囲みが出ます（プラグイン）。${f.status?"状況："+esc(f.status)+"・":""}${f.event_date?esc(f.event_date)+" "+esc(f.event_time||""):""}</div>`);i++;continue}
    if(s.startsWith("|")&&L[i+1]&&/^\|?\s*:?-{2,}/.test(L[i+1].trim())){
      const rows=[];while(i<L.length&&L[i].trim().startsWith("|")){rows.push(L[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));i++}
      out.push(`<div class="tw"><table><thead><tr>${rows[0].map(c=>`<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(2).map(r=>`<tr>${r.map(c=>`<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);continue}
    if(/^[-*]\s+/.test(s)||/^\d+[.)]\s+/.test(s)){
      const ord=/^\d/.test(s),re=ord?/^\s*\d+[.)]\s+/:/^\s*[-*]\s+/,items=[];
      while(i<L.length&&re.test(L[i])){items.push(L[i].replace(re,"").trim());i++}
      out.push(`<${ord?"ol":"ul"}>${items.map(x=>`<li>${mdInline(x)}</li>`).join("")}</${ord?"ol":"ul"}>`);continue}
    if(s.startsWith(">")){const q=[];while(i<L.length&&L[i].trim().startsWith(">")){q.push(L[i].trim().replace(/^>\s?/,""));i++}out.push(`<blockquote>${q.map(mdInline).join("<br>")}</blockquote>`);continue}
    if(/^-{3,}$/.test(s)){out.push("<hr>");i++;continue}
    const p=[s];i++;while(i<L.length&&L[i].trim()&&!isBlock(L[i])){p.push(L[i].trim());i++}
    out.push(`<p>${mdInline(p.join(""))}</p>`);
  }
  return out.join("");
}
// 画像を保存（downloads が使えればそれで、無ければリンクで）
async function saveImage(dataUrl,filename){
  try{const dl=window.claude&&await window.claude.use("downloads");
    if(dl){const bin=atob(dataUrl.split(",")[1]),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
      await dl.save({filename,data:new Blob([u],{type:"image/jpeg"})});return}}catch(e){if(e&&e.code==="cancelled")return}
  const l=document.createElement("a");l.href=dataUrl;l.download=filename;document.body.appendChild(l);l.click();l.remove();
}
function copyText(txt,label,fallbackEl){

    if(fallbackEl){fallbackEl.hidden=false;fallbackEl.value=txt;fallbackEl.focus();fallbackEl.select();toast("選択しました。コピーしてください")}else toast("コピーできませんでした")});
}

/* ---------- 編集シート ---------- */
const FORMS={
  event:{col:"events",title:"イベント",fields:[
    ["title","イベント名","text","wide"],["pillar","柱","select",Object.keys(PILLAR)],["status","状態","select",Object.keys(EV_STATUS)],
    ["date","日付（決まっていれば）","date"],["time","時刻","text"],["dateText","未定のときの表記（例：2026年度中）","text"],["place","場所","text"],
    ["source","出典URL","url","wide"],["note","メモ","textarea","wide"]]},
  article:{col:"articles",title:"記事",fields:[
    ["title","タイトル案","text","wide"],["priority","優先順位","number"],["pillar","柱","select",Object.keys(PILLAR)],["status","状態","select",AR_STATUS],
    ["template","記事の型","select",["A 打ち上げ","B 天体","C 宇宙スポット","D 機材","常設"]],["path","URL（例：/launch/h3-f10-mmx/）","text","wide"],["tags","タグ（カンマ区切り。h3, tanegashima など決まった名前だけ）","text","wide"],["keyword","検索キーワード","text","wide"],["intent","検索意図","textarea","wide"],
    ["eventDate","イベント日（更新タスクの基準）","date"],["publishBy","公開期限（空なら自動）","date"],["monetize","収益化の導線","text","wide"],
    ["url","公開URL","url","wide"],["lastVerified","最終確認日","date"],["note","メモ","textarea","wide"]]},
  post:{col:"posts",title:"SNS投稿",fields:[
    ["date","投稿日","date"],["time","時刻","text"],["channel","媒体","select",["X","Instagram","両方"]],["status","状態","select",Object.keys(POST_STATUS)],
    ["text","本文","textarea","wide"],["imageUrl","画像のURL（Instagram は必須。画像担当の画像を WordPress のメディアなどに上げた URL）","url","wide"],["imageNote","画像のメモ（作り直すときの指示もここに）","text","wide"],["articleId","関連記事","article","wide"]]},
  kpi:{col:"kpi",title:"KPI（月）",fields:[["month","月（例：2026-12）","text","wide"],...KPI_DEF.map(d=>[d.k,`${d.l}（${d.u}）`,"number"])]}
};
const listFor=k=>({event:S.events,article:S.articles,post:S.posts,kpi:S.kpi}[k]);
function addBtn(kind,label){return S.canWrite?`<button type="button" class="d-btn small" data-add="${kind}">${ic("plus")}${label}</button>`:""}

function openSheet(kind,id){
  const F=FORMS[kind],cur={...(id?listFor(kind).find(x=>x._id===id)||{}:{})};
  if(kind==="kpi"&&id) cur.month=id;
  const ro=!S.canWrite;
  const fld=([k,l,t,opt])=>{const v=Array.isArray(cur[k])?cur[k].join(", "):(cur[k]??""),fid=`f-${kind}-${k}`,cls=`d-fld${opt==="wide"||t==="textarea"?" wide":""}`;
    if(t==="select") return `<label class="${cls}" for="${fid}">${l}<select id="${fid}" name="${k}" ${ro?"disabled":""}>${opt.map(o=>`<option value="${esc(o)}" ${String(v)===o?"selected":""}>${esc(PILLAR[o]||o)}</option>`).join("")}</select></label>`;
    if(t==="article") return `<label class="${cls}" for="${fid}">${l}<select id="${fid}" name="${k}" ${ro?"disabled":""}><option value="">なし</option>${[...S.articles].sort((a,b)=>(a.priority??999)-(b.priority??999)).map(a=>`<option value="${esc(a._id)}" ${v===a._id?"selected":""}>${esc(a.title)}</option>`).join("")}</select></label>`;
    if(t==="textarea") return `<label class="${cls}" for="${fid}">${l}<textarea id="${fid}" name="${k}" ${ro?"readonly":""}>${esc(v)}</textarea></label>`;
    return `<label class="${cls}" for="${fid}">${l}<input id="${fid}" name="${k}" type="${t}" value="${esc(v)}" ${ro||(kind==="kpi"&&k==="month"&&id)?"readonly":""}></label>`};
  $("#sheetHost").innerHTML=`<div class="sheet-backdrop" id="sbk"></div>
  <form class="sheet" id="sheet" aria-label="${F.title}の編集">
    <div class="sheet-bar"><button type="button" class="text-btn" id="scancel">キャンセル</button><h2>${id?F.title+"を編集":F.title+"を追加"}</h2>
      <button type="submit" class="text-btn strong" ${ro?"disabled":""}>保存</button></div>
    <div class="sheet-scroll"><div class="d-form">${kind==="article"&&id?agentBox(cur):""}<div class="d-fields">${F.fields.map(fld).join("")}</div>
      ${id&&!ro?`<div class="d-actions" style="margin-top:8px"><button type="button" class="d-btn danger small" id="sdel">削除</button></div>`:""}
      ${ro?`<p class="note">閲覧のみです。編集できるのは編集者以上です。</p>`:""}</div></div>
  </form>`;
  requestAnimationFrame(()=>{$("#sbk").classList.add("open");$("#sheet").classList.add("open")});
  const close=()=>{const s=$("#sheet"),b=$("#sbk");if(!s)return;s.classList.remove("open");b.classList.remove("open");setTimeout(()=>{$("#sheetHost").innerHTML=""},380);removeEventListener("keydown",onKey)};
  const onKey=e=>{if(e.key==="Escape")close()};addEventListener("keydown",onKey);
  $("#sbk").onclick=close;$("#scancel").onclick=close;
  if(kind==="article"&&id) bindAgentBox(cur,close);
  const del=$("#sdel");
  if(del) del.onclick=async()=>{
    if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="もう一度押すと削除";return}
    try{await S.db.doc(F.col+"/"+id).delete();toast("削除しました");close()}catch(e){toast("削除できませんでした："+(e.message||e.code))}
  };
  $("#sheet").addEventListener("submit",async e=>{e.preventDefault();if(ro||!S.db)return;
    const fd=new FormData(e.target),data={};
    for(const [k,,t] of F.fields){let v=fd.get(k);if(v==null)continue;v=String(v).trim();if(t==="number")v=v===""?null:Number(v);if(k==="tags")v=v.split(/[,、\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean);data[k]=v}
    if(data.tags){const bad=data.tags.filter(t=>!TAGS[t]);if(bad.length){toast("決まりにないタグ："+bad.join(", "));return}}
    let docId=id;
    if(kind==="kpi"){if(!/^\d{4}-\d{2}$/.test(data.month||"")){toast("月は 2026-12 の形で入れてください");return}docId=data.month;delete data.month}
    else if(kind!=="post"&&!data.title){toast("名前を入れてください");return}
    data.updatedAt=new Date().toISOString();
    // 既にあるカードは差分だけ書く（エージェントの稿・査読を消さないため）
    const exists=docId&&listFor(kind).some(x=>x._id===docId);
    try{const ref=docId?S.db.doc(F.col+"/"+docId):S.db.collection(F.col).doc();await (exists?ref.update(data):ref.set(data));toast("保存しました");close()}
    catch(err){toast(err.code==="invalid_argument"?"保存する権限がありません":"保存できませんでした："+(err.message||err.code))}
  });
}

    if(st==="on"&&b.dataset.armed!=="1"){b.dataset.armed="1";toast(`もう一度押すと${GROUPS[g].l}をオフにします`);setTimeout(()=>{b.dataset.armed=""},4000);return}
    setGroup(g,st!=="on")});
  pg.querySelectorAll("[data-evmode]").forEach(b=>b.onclick=()=>{S.evMode=b.dataset.evmode;try{localStorage.setItem("mm-evmode",S.evMode)}catch(_){}render()});
  pg.querySelectorAll("[data-evmonth]").forEach(b=>b.onclick=()=>{const v=+b.dataset.evmonth,t=today();let base=S.evMonth?new Date(S.evMonth+"T00:00:00"):new Date(t.getFullYear(),t.getMonth(),1);
    base=v===0?new Date(t.getFullYear(),t.getMonth(),1):new Date(base.getFullYear(),base.getMonth()+v,1);S.evMonth=`${base.getFullYear()}-${pad(base.getMonth()+1)}-01`;render()});
  bindSns(pg);
  pg.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{S.snsCh=b.dataset.ch;render()});
  pg.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{S.filter.pillar=b.dataset.filter;render()});
  pg.querySelectorAll("[data-chk]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.chk,k=b.dataset.k,cur={...(S.checks[id]||{})};cur[k]=b.getAttribute("aria-pressed")!=="true";
    S.checks[id]=cur;render();
    try{await S.db.doc("checks/"+id).set({done:cur})}catch(e){toast("保存できませんでした："+(e.message||e.code))}
  });
  bindAgents(pg);bindInbox(pg);
  pg.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  pg.querySelectorAll("[data-keep]").forEach(el=>el.addEventListener("input",()=>{S.inputs[el.id]=el.value}));
}

/* ---------- 戻る（画面の左端からの右スワイプ・Esc） ---------- */
function canBack(){return !!($("#islandPanel")||$("#scancel")||S.hist.length)}
function updBack(){const b=$("#backBtn");if(b)b.hidden=!canBack()}
function back(){
  if($("#islandPanel")){closeIslandPanel();return true}
  const sc=$("#scancel");if(sc){sc.click();return true}
  if(S.hist.length){go(S.hist.pop(),true);return true}
  return false;
}
new MutationObserver(updBack).observe($("#sheetHost"),{childList:true});
(function swipe(){
  let x0=null,y0=0;
  addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX<=24?t.clientX:null;y0=t.clientY},{passive:true});
  addEventListener("touchend",e=>{if(x0==null)return;const t=e.changedTouches[0];if(t.clientX-x0>70&&Math.abs(t.clientY-y0)<60)back();x0=null},{passive:true});
})();
setInterval(()=>{if(S.ready){renderIsland();renderAuto()}},1000);
setInterval(()=>{if(S.ready&&$("#islandPanel"))fillIslandPanel()},15000);

/* ---------- 起動 ---------- */
try{const v=localStorage.getItem("mm-evmode");if(v==="cal"||v==="list")S.evMode=v}catch(_){}
try{const t=localStorage.getItem("mm-tab");if(TABS.some(x=>x.id===t))S.tab=t}catch(_){}
try{if(localStorage.getItem("mm-tabpos")==="side")document.documentElement.dataset.tabbar="side"}catch(_){}
buildTabbar();
$("#inboxBtn").onclick=()=>go("inbox");
// ダーク／ライトの切り替え（端末ごとに覚える）
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
const paintTheme=()=>{$("#themeBtn").innerHTML=isDark()?'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
try{const t=localStorage.getItem("mm-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(_){}
paintTheme();
$("#themeBtn").onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("mm-theme",t)}catch(_){}paintTheme()};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintTheme);
$("#backBtn").onclick=()=>{back();setTimeout(updBack,450)};
render();requestAnimationFrame(()=>placeLens(false));

(async function boot(){
  const conn=$("#conn"),setConn=(cls,txt)=>{conn.className="conn "+cls;conn.querySelector(".txt").textContent=txt};
  const api=window.claude;
  const db=api&&api.use?await api.use("db"):null;
  if(!db){setConn("off","データに接続できません");S.ready=true;S.canWrite=false;render();return}
  S.db=db;
  try{const user=await api.use("user");if(user){const ed=await user.canEdit();if(ed===false)S.canWrite=false}}catch(_){}
  setConn("on",S.canWrite?"共有データに保存":"閲覧のみ");
  const pending=new Set(["events","articles","posts","kpi","checks","jobs","settings","inbox"]);
  const done=n=>{pending.delete(n);if(!pending.size){S.ready=true;kickQueued()}render()};
  api.use("mcp").then(m=>{S.mcp=m;if(S.ready)kickQueued();render()}).catch(()=>{});
  const sub=(col,fn)=>db.collection(col).onSnapshot(s=>{fn(s.docs.map(d=>({...d.data(),_id:d.id})));done(col)},()=>setConn("off","接続が切れました。再読み込みしてください"));
  sub("events",l=>S.events=l);
  sub("articles",l=>S.articles=l);
  sub("posts",l=>S.posts=l);
  sub("kpi",l=>S.kpi=l);
  sub("checks",l=>{S.checks={};for(const c of l)S.checks[c._id]=c.done||{}});
  sub("inbox",l=>S.inbox=l);
  sub("jobs",l=>{S.jobs=l.sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));if(S.ready)kickQueued()});
  sub("settings",l=>{const m={};for(const d of l)m[d._id]=d;S.bg=m.background||{};S.pauseRaw=(m.agentPause&&m.agentPause.roles)||{};S.pause=Object.fromEntries(Object.entries(S.pauseRaw).map(([k,v])=>[k,!!(v&&v.paused)]));
    S.snsConf=m.sns||{};S.lessons=(m.writerLessons&&m.writerLessons.items)||[];S.plannerLog=(m.plannerLog&&m.plannerLog.items)||[];S.loopConf={enabled:true,maxRounds:5,pass:"A",...(m.reviewLoop||{})};S.selConf={days:14,count:3,auto:false,minStock:3,...(m.selection||{})}});
})();
})();
